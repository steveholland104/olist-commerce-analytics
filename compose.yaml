services:
  postgres:
    image: postgres:18
    container_name: olist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - olist_postgres_data:/var/lib/postgresql

volumes:
  olist_postgres_data:
